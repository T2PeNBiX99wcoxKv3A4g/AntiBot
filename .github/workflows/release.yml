name: Release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dev/**"
      - "dependabot/**"
    paths-ignore:
      - "README.md"
      - "README.*.md"
      - ".gitignore"
      - "LICENSE*"
      - "Site/**"
      # Workflow, template and shared-list changes are not a desktop release.
      - ".github/**"
      # The shared community list changes on every submission; it is data, not a release.
      - "data/**"
      # The site's own copy of the shared package: the desktop build never uses it.
      - "AntiBot/Libs/photino-net-utils-site-*.tgz"
      - ".github/workflows/site.yml"
      - ".github/workflows/dependabot-auto-merge.yml"

permissions:
  contents: write

jobs:
  release:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/csharp_release.yml@main
    with:
      project_path: ./AntiBot/AntiBot.csproj
      filename: AntiBot
      dotnet_version: '11.0.x'
      runtimes: '["win-x64", "linux-x64"]'
      version_file_path: ./AntiBot/AntiBot.csproj
      version_keyword: Version
      msi_script: 'installer/windows/build-msi.ps1'
      rpm_script: 'installer/linux/build-rpm.sh'
      deb_script: 'installer/linux/build-deb.sh'
      arch_script: 'installer/linux/build-arch.sh'
    secrets: inherit
