name: Pre Release

# Pre-releases are built from every dev/** branch; master is handled by release.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - "dev/**"
    paths-ignore:
      - "README.md"
      - "README.*.md"
      - "LICENSE*"
      - "Site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: write

jobs:
  release:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/csharp_release.yml@main
    with:
      project_path: ./AntiBot/AntiBot.csproj
      filename: AntiBot
      dotnet_version: '11.0.x'
      runtimes: '["win-x64", "linux-x64"]'
      version_file_path: ./AntiBot/AntiBot.csproj
      version_keyword: Version
      prerelease: true
      msi_script: 'installer/windows/build-msi.ps1'
      rpm_script: 'installer/linux/build-rpm.sh'
      deb_script: 'installer/linux/build-deb.sh'
      arch_script: 'installer/linux/build-arch.sh'
    secrets: inherit
