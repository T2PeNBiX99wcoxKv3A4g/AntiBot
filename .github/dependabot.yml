version: 2

updates:
  - package-ecosystem: nuget
    directory: /AntiBot
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: npm
    directory: /AntiBot/UserInterface
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
